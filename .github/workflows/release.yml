name: release

on:
  push:
    tags: ["v*"]
  # Allows building the installer on demand without cutting a tag.
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build portable payload
        shell: pwsh
        run: ./scripts/publish-portable.ps1 -Configuration Release

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipPublish

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Optim-release
          path: |
            release/*.zip
            release/*setup*.exe
          if-no-files-found: error
